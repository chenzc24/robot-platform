services:
  lineart-models:
    build:
      context: ./model-service
    environment:
      MODEL_MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
      HF_HOME: /model-cache
      LINEART_MODEL_REPOSITORY: ${LINEART_MODEL_REPOSITORY:-lllyasviel/Annotators}
      LINEART_DETECTOR_PLUGINS: ${LINEART_DETECTOR_PLUGINS:-}
    volumes:
      - model-cache:/model-cache
    restart: unless-stopped

  stroke-review:
    build: .
    depends_on:
      lineart-models:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      APP_ACCESS_USERNAME: ${APP_ACCESS_USERNAME:-}
      APP_ACCESS_PASSWORD: ${APP_ACCESS_PASSWORD:-}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
      LINEART_LOCAL_SERVICE_URL: http://lineart-models:8010
      STROKE_PIPELINE_PLUGINS: ${STROKE_PIPELINE_PLUGINS:-}
      QWEN_CLOUD_ENABLED: ${QWEN_CLOUD_ENABLED:-true}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      QWEN_DASHSCOPE_BASE_URL: ${QWEN_DASHSCOPE_BASE_URL:-}
      QWEN_IMAGE_MODEL: ${QWEN_IMAGE_MODEL:-qwen-image-edit-plus-2025-12-15}
      QWEN_IMAGE_SEED: ${QWEN_IMAGE_SEED:-20260902}
      QWEN_CLOUD_TIMEOUT_SECONDS: ${QWEN_CLOUD_TIMEOUT_SECONDS:-600}
      QWEN_MAX_CONCURRENCY: ${QWEN_MAX_CONCURRENCY:-1}
      QWEN_DAILY_REQUEST_LIMIT: ${QWEN_DAILY_REQUEST_LIMIT:-20}
      QWEN_CACHE_ENABLED: ${QWEN_CACHE_ENABLED:-true}
      QWEN_CACHE_DIR: /qwen-cache
      QWEN_MAX_OUTPUT_MB: ${QWEN_MAX_OUTPUT_MB:-20}
    volumes:
      - qwen-cache:/qwen-cache
    restart: unless-stopped

volumes:
  model-cache:
  qwen-cache:
